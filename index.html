<!doctype html>
<html lang="en" data-mode="dark" data-theme="fantasy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="/speakfiction-logo.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SpeakFiction</title>
    <script>
      (function () {
        try {
          var mode =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          var raw = null;
          if (window.speakfiction && window.speakfiction.state && window.speakfiction.state.loadSync) {
            raw = window.speakfiction.state.loadSync();
          }
          if (!raw) raw = localStorage.getItem('speakfiction-state-v1');
          if (raw) {
            var parsed = JSON.parse(raw);
            var s = parsed.state || parsed;
            if (s.themeMode === 'light' || s.themeMode === 'dark') mode = s.themeMode;
            var themeId = s.themeId;
            var books = s.books || [];
            var active = null;
            for (var i = 0; i < books.length; i++) {
              if (books[i].id === s.activeBookId) {
                active = books[i];
                break;
              }
            }
            if (!active) active = books[0];
            var palette =
              themeId && themeId !== 'auto'
                ? themeId
                : (active && active.genreId) || 'fantasy';
            document.documentElement.setAttribute('data-theme', palette);
          }
          document.documentElement.setAttribute('data-mode', mode);
          document.documentElement.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
